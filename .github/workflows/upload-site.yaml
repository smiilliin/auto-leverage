name: Update AUTO-LEVERAGE

on:
  push:
    branches:
      - main

  schedule:
    # 매주 월요일부터 금요일까지, 미국 동부 시간 기준 오전 9시 (UTC 기준 오후 2시)
    - cron: "0 14 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 0. AUTO-LEVERAGE checkout
      # -------------------------
      - name: Checkout AUTO-LEVERAGE
        uses: actions/checkout@v6
      
      # -------------------------
      # 1. Keep repository active
      # -------------------------
        
      - name: Keep repository active
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep workflow active"
          git push

      # -------------------------
      # 2. Python environment
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync --frozen

      # -------------------------
      # 3. Run model
      # -------------------------
      - name: Run AUTO-LEVERAGE
        run: |
          uv run python garch_auto_leverage.py

      # -------------------------
      # 4. Generate visualization
      # -------------------------
      - name: Generate visualization
        run: |
          uv run python visualize_garch.py

      # -------------------------
      # 5. Checkout GitHub Pages repo
      # -------------------------
      - name: Checkout personal website
        uses: actions/checkout@v6
        with:
          repository: smiilliin/smiilliin.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: site

      # -------------------------
      # 6. Copy generated files
      # -------------------------
      - name: Update website
        run: |
          cp index.html site/auto-leverage/
          cp leverage.json site/auto-leverage/
          cp leverage-history.json site/auto-leverage/
          cp visual-sp500-garch-auto.png site/auto-leverage/
          cp visual-sp500-garch-auto.png site/auto-leverage/visual-qqq-qld-auto.png

      # -------------------------
      # 7. Commit and push
      # -------------------------
      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-leverage/index.html
          git add auto-leverage/leverage.json
          git add auto-leverage/leverage-history.json
          git add auto-leverage/visual-sp500-garch-auto.png

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "update auto-leverage"
          git push